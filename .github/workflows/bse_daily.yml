name: Daily BSE Fetcher

# STAGE 1 - never touches R2 (needs no R2 secrets):
#   downloads BSE's bhavcopy -> RAW prices committed to git as small files (data/raw/<year>/<yyyy-mm>.parquet)
#   reads the corporate-action CSVs -> adjustment factors (data/factors_cache.csv)
#   CHECKS the adjustments with a dry-run build and prints a report (events applied / skipped / warnings)
# STAGE 2 - the separate workflow "BSE Upload to R2" builds the adjusted files and writes them to R2. Run it only when the report looks right.

on:
  schedule:
    - cron: '45 13 * * 1-5'      # 19:15 IST, Monday to Friday (BSE publishes its bhavcopy in the evening)
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date YYYY-MM-DD (empty = the day after the last stored day; first run: 2007-01-01)'
        required: false
        default: ''
      end_date:
        description: 'End date YYYY-MM-DD (empty = today)'
        required: false
        default: ''
      probe:
        description: 'Only test which BSE file types exist for sample dates (changes nothing)'
        type: boolean
        default: false
      ca_backfill_from:
        description: 'Optional: try BSE corporate-action history from this year via the BSE API (it refuses GitHub: HTTP 403, so use the CSV files instead)'
        required: false
        default: ''
      check_adjustments:
        description: 'Run the dry-run build and print the adjustment report (no R2)'
        type: boolean
        default: true
      recompute_factors:
        description: 'Recompute every adjustment factor from the raw prices (tick after adding or changing corporate-action CSVs)'
        type: boolean
        default: false

concurrency:
  group: bse-data                # never two BSE runs at the same time
  cancel-in-progress: false

jobs:
  bse:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    env:
      PERIOD_MODE: year          # must be the same as in "BSE Upload to R2"
      PYTHONUNBUFFERED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyarrow boto3 requests

      - name: Probe BSE file types (changes nothing)
        if: ${{ github.event.inputs.probe == 'true' }}
        run: PROBE=true python backend/fetch.py

      - name: Download BSE bhavcopy (raw prices into data/raw/)
        if: ${{ github.event.inputs.probe != 'true' }}
        env:
          START_DATE: ${{ github.event.inputs.start_date }}
          END_DATE: ${{ github.event.inputs.end_date }}
          MAX_RUNTIME_MINUTES: '270'     # stops itself after 4.5 h and keeps everything downloaded; run again to continue
        run: python backend/fetch.py

      - name: Corporate-action history via BSE API (usually refused, optional)
        if: ${{ github.event.inputs.probe != 'true' && github.event.inputs.ca_backfill_from != '' }}
        continue-on-error: true
        run: python backend/actions.py --backfill ${{ github.event.inputs.ca_backfill_from }}

      - name: Corporate actions of the last days (BSE live list, usually refused)
        if: ${{ github.event.inputs.probe != 'true' }}
        continue-on-error: true
        run: python backend/actions.py --live

      - name: Check the adjustments (dry run, NOTHING is written to R2)
        if: ${{ github.event.inputs.probe != 'true' && github.event.inputs.check_adjustments != 'false' }}
        continue-on-error: true
        env:
          DRY_RUN: 'true'
          RECOMPUTE_FACTORS: ${{ github.event.inputs.recompute_factors || 'false' }}
        run: python backend/build.py

      - name: Save raw prices, corporate actions and factors to git
        if: ${{ !cancelled() && github.event.inputs.probe != 'true' }}
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add -A data/raw data/scrips.json data/state.json data/corporate_actions data/factors_cache.csv || true
          git commit -m "BSE raw prices, corporate actions and factors" || exit 0
          git pull --rebase origin main
          git push origin main
